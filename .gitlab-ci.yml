# 외부 파일 포함
include:
  - local: ".gitlab-ci-frontend.yml"

image: gradle:7-jdk17

stages:
  - build
  - deploy

variables:
  JAR_NAME: goldenticketBE.jar
  EC2_USER: ubuntu
  EC2_HOST: $SPRING_EC2_URL
  DEPLOY_PATH: /home/ubuntu/app
  # SSH_KEY_PATH는 before_script에서 동적으로 설정되므로, 여기서는 제거하거나 주석 처리해도 무방합니다.

before_script:
  - echo "🔐 Setting up SSH key"
  - mkdir -p ~/.ssh
  # GitLab CI/CD 변수 SSH_PRIVATE_KEY를 사용하여 키 파일 생성
  # CR/LF 문제 방지를 위해 tr -d '\r' 사용
  - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
  - chmod 600 ~/.ssh/id_rsa
  # ssh-keyscan은 초기 연결 시 Known Hosts 파일에 서버 호스트 키를 추가하여
  # 'Are you sure you want to continue connecting (yes/no)?' 메시지를 방지합니다.
  # 이미 알려진 호스트인 경우 불필요하지만, 자동화된 환경에서는 추가하는 것이 좋습니다.
  - ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

build:
  stage: build
  script:
    - echo "🏗️ Building project..."
    - cd Ticket_BackEnd/
    # Gradle Wrapper 권한 부여 및 빌드 (테스트 제외)
    - chmod +x ./gradlew
    - ./gradlew clean build -x test
    # 빌드된 JAR 파일 목록 확인
    - ls build/libs/
    # 정확히 하나의 JAR 파일만 있고 그 이름을 고정하고 싶을 때 유용합니다.
    # 만약 여러 개의 JAR 파일이 생성될 가능성이 있다면, 특정 패턴으로 찾거나 더 견고한 방법 필요
    - cp build/libs/Ticket_BackEnd-0.0.1-SNAPSHOT.jar build/libs/$JAR_NAME
  artifacts:
    paths:
      - Ticket_BackEnd/build/libs/$JAR_NAME
    expire_in: 1 hour

#  파이썬 챗봇 빌드 Job (추가됨)
python_chatbot_build:
  image: python:3.10
  stage: build
  script:
    - echo "🐍 Building Python chatbot..."
    - cd Ticket-Chatbot/
    - pip install --upgrade pip
    - pip install -r requirements.txt # 너가 준 requirements.txt 기준
  artifacts:
    paths:
      - Ticket-Chatbot/
    expire_in: 1 hour
  only:
    - master

deploy:
  stage: deploy
  dependencies: # 👈 여기에만 추가
    - frontend_build # 👈 여기에만 추가
    - build # 👈 여기에만 추가
    - python_chatbot_build # ✅ 파이썬 챗봇 빌드 결과 사용 (추가됨)
  script:
    - echo "🚀 Deploying to EC2..."
    # ✅ 파이썬 챗봇 업로드 (추가됨)
    - echo "📤 Uploading Python chatbot to EC2..."
    - scp -r -i ~/.ssh/id_rsa Ticket-Chatbot $EC2_USER@$EC2_HOST:/home/ubuntu/

      # ✅ 파이썬 챗봇 .env 업로드 (추가됨)
    - echo "📄 Uploading .env file to EC2..."
    - scp -i ~/.ssh/id_rsa Ticket-Chatbot/.env $EC2_USER@$EC2_HOST:/home/ubuntu/Ticket-Chatbot/.env

    # ✅ 파이썬 챗봇 설치 및 가상환경 구성 (추가됨)
    - echo "⚙️ Setting up Python chatbot on EC2..."
    - ssh -i ~/.ssh/id_rsa $EC2_USER@$EC2_HOST "
      cd /home/ubuntu &&
      sudo apt update &&
      sudo apt install -y python3-venv &&
      python3 -m venv chatbot-venv &&
      source chatbot-venv/bin/activate &&
      pip install --upgrade pip &&
      pip install -r Ticket-Chatbot/requirements.txt
      "

    # 프론트엔드 배포
    - scp -r -i ~/.ssh/id_rsa Ticket-FrontEnd/dist/* $EC2_USER@$EC2_HOST:/var/www/html/ # 👈 추가
    # SSH 키 경로를 명시적으로 ~/.ssh/id_rsa로 사용
    # JAR 파일을 EC2의 지정된 경로로 복사
    - scp -i ~/.ssh/id_rsa Ticket_BackEnd/build/libs/$JAR_NAME $EC2_USER@$EC2_HOST:$DEPLOY_PATH
    # EC2에서 배포 스크립트 실행 (JAR_NAME을 인자로 전달)
    - ssh -i ~/.ssh/id_rsa $EC2_USER@$EC2_HOST "
      SPRING_EC2_URL='$SPRING_EC2_URL'
      SPRING_DATASOURCE_URL='$SPRING_DATASOURCE_URL'
      SPRING_DATASOURCE_USERNAME='$SPRING_DATASOURCE_USERNAME'
      SPRING_DATASOURCE_PASSWORD='$SPRING_DATASOURCE_PASSWORD'
      SPRING_REDIS_PASSWORD='$SPRING_REDIS_PASSWORD'
      JWT_SECRET='$JWT_SECRET'
      KAKAO_REST_API_KEY='$KAKAO_REST_API_KEY'
      NAVER_CLIENT_ID='$NAVER_CLIENT_ID'
      NAVER_CLIENT_SECRET='$NAVER_CLIENT_SECRET'
      CLOUD_AWS_CREDENTIALS_ACCESS_KEY='$CLOUD_AWS_CREDENTIALS_ACCESS_KEY'
      CLOUD_AWS_CREDENTIALS_SECRET_KEY='$CLOUD_AWS_CREDENTIALS_SECRET_KEY'
      SMS_API_KEY='$SMS_API_KEY'
      SMS_API_SECRET_KEY='$SMS_API_SECRET_KEY'
      KAKAOPAY_API_KEY='$KAKAOPAY_API_KEY'
      FE_BASE_URL='$FE_BASE_URL'
      BE_BASE_URL='$BE_BASE_URL'
      bash $DEPLOY_PATH/deploy.sh $JAR_NAME"

  only:
    - BE/Python # master 브랜치에 푸시될 때만 배포 실행

